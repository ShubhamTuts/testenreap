name: Build Dhan Mudra Android

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'dhanmudra-android/**'
      - '.github/workflows/dhanmudra-android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK and AAB
        id: android_build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p release-output
          set +e
          gradle -p dhanmudra-android --no-daemon clean assembleRelease bundleRelease 2>&1 | tee release-output/build.log
          STATUS=${PIPESTATUS[0]}
          echo "$STATUS" > release-output/build-status.txt
          if [ "$STATUS" -eq 0 ]; then
            cp dhanmudra-android/app/build/outputs/apk/release/*.apk release-output/ || true
            cp dhanmudra-android/app/build/outputs/bundle/release/*.aab release-output/ || true
            mkdir -p release-output/tools/lib
            cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" release-output/tools/apksigner
            cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-output/tools/lib/apksigner.jar
            cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" release-output/tools/zipalign
          fi
          exit "$STATUS"

      - name: Upload build outputs and signing tools
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DhanMudra-Build
          path: release-output/**
          if-no-files-found: error
          retention-days: 7

      - name: Fail job if Android build failed
        if: steps.android_build.outcome == 'failure'
        shell: bash
        run: exit 1
